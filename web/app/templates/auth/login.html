{% extends "base.html" %}

{% block title %}Entrar | Atalaia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Entrar</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Usuario</label>
                        <input class="form-control" type="text" name="username" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Senha</label>
                        <input class="form-control" type="password" name="password" id="id_password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Acessar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
